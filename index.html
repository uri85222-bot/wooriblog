<script>
/* =========================================================
   우리주방그릇 → n8n 전송
   - 일반 입력값 자동 수집
   - 모든 사진을 photo_0, photo_1, photo_2... 로 통일
   - 사진의 원래 항목명은 photoType_0, photoType_1... 로 전송
   ========================================================= */

const webhookUrl =
  "https://uri85222.app.n8n.cloud/webhook/wooriblog";


/* =========================================================
   파일 항목의 표시 이름 찾기

   예:
   상장 사진
   도면 사진 1
   시공 전 사진
   시공 후 사진
   제품 설치 사진
   ========================================================= */

function getPhotoType(input) {

  // 1. data-label이 있으면 가장 먼저 사용
  if (input.dataset.label) {
    return input.dataset.label;
  }

  // 2. name이 있으면 사용
  if (input.name) {
    return input.name;
  }

  // 3. id가 있으면 사용
  if (input.id) {

    const label = document.querySelector(
      `label[for="${input.id}"]`
    );

    if (label) {
      return label.innerText.trim();
    }

    return input.id;
  }

  return "사진";
}


/* =========================================================
   폼 전송 함수
   ========================================================= */

async function submitToN8n(event) {

  event.preventDefault();

  const form = event.target;

  const submitButton =
    form.querySelector('button[type="submit"]');

  const originalButtonText =
    submitButton ? submitButton.innerText : "";


  try {

    /* -----------------------------
       버튼 상태 변경
       ----------------------------- */

    if (submitButton) {

      submitButton.disabled = true;

      submitButton.innerText =
        "전송 중입니다...";

    }


    /* =====================================================
       FormData 생성
       ===================================================== */

    const formData = new FormData();


    /* =====================================================
       1. 일반 텍스트 / select / textarea 수집
       ===================================================== */

    const fields = form.querySelectorAll(
      'input:not([type="file"]):not([type="submit"]), textarea, select'
    );


    fields.forEach(field => {

      if (!field.name) return;


      /* checkbox */

      if (field.type === "checkbox") {

        if (field.checked) {

          formData.append(
            field.name,
            field.value || "true"
          );

        }

        return;

      }


      /* radio */

      if (field.type === "radio") {

        if (field.checked) {

          formData.append(
            field.name,
            field.value
          );

        }

        return;

      }


      /* 일반 입력 */

      formData.append(
        field.name,
        field.value ?? ""
      );

    });


    /* =====================================================
       2. 사진 자동 수집

       어떤 콘텐츠 종류든 관계없이:

       photo_0
       photo_1
       photo_2
       ...

       로 통일한다.
       ===================================================== */

    const fileInputs =
      form.querySelectorAll('input[type="file"]');


    let photoIndex = 0;


    fileInputs.forEach(input => {

      if (!input.files) return;

      if (input.files.length === 0) return;


      const photoType =
        getPhotoType(input);


      Array.from(input.files).forEach(file => {


        /* 실제 binary 파일 */

        formData.append(
          `photo_${photoIndex}`,
          file,
          file.name
        );


        /* 사진 종류 */

        formData.append(
          `photoType_${photoIndex}`,
          photoType
        );


        /* 원본 파일명 */

        formData.append(
          `photoName_${photoIndex}`,
          file.name
        );


        photoIndex++;

      });

    });


    /* =====================================================
       3. 총 사진 개수
       ===================================================== */

    formData.append(
      "photoCount",
      String(photoIndex)
    );


    /* =====================================================
       DEBUG

       F12 → Console에서
       실제 전송 데이터를 확인할 수 있음
       ===================================================== */

    console.log(
      "===== n8n 전송 시작 ====="
    );


    for (const [key, value] of formData.entries()) {

      if (value instanceof File) {

        console.log(
          key,
          "FILE:",
          value.name,
          value.type,
          value.size
        );

      } else {

        console.log(
          key,
          value
        );

      }

    }


    /* =====================================================
       4. n8n Webhook 전송

       중요:
       Content-Type을 직접 넣지 않는다.

       브라우저가 multipart/form-data와
       boundary를 자동 생성해야 한다.
       ===================================================== */

    const response = await fetch(
      webhookUrl,
      {

        method: "POST",

        body: formData

      }
    );


    /* =====================================================
       5. HTTP 오류 처리
       ===================================================== */

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "n8n 오류:",
        response.status,
        errorText
      );


      throw new Error(
        `HTTP ${response.status}`
      );

    }


    /* =====================================================
       성공
       ===================================================== */

    console.log(
      "===== n8n 전송 성공 ====="
    );


    alert(
      "콘텐츠 생성 요청이 완료되었습니다."
    );


  } catch (error) {


    console.error(
      "n8n 전송 오류:",
      error
    );


    alert(
      "n8n 전송에 실패했습니다.\n\n" +
      error.message
    );


  } finally {


    /* 버튼 복구 */

    if (submitButton) {

      submitButton.disabled = false;

      submitButton.innerText =
        originalButtonText;

    }

  }

}


/* =========================================================
   페이지의 모든 form에 자동 적용

   대표약력
   도면
   시공사례

   어느 form이든 동일한 전송 방식을 사용한다.
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    const forms =
      document.querySelectorAll("form");


    forms.forEach(form => {

      form.addEventListener(
        "submit",
        submitToN8n
      );

    });


    console.log(
      "우리주방그릇 n8n 전송 시스템 준비 완료"
    );

  }
);

</script>
