<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>우리주방그릇 콘텐츠 작성</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial, "Noto Sans KR", sans-serif;
  color: #222;
}

.container {
  max-width: 820px;
  margin: 60px auto;
  padding: 0 20px;
}

.header {
  margin-bottom: 35px;
}

.header h1 {
  margin: 0 0 8px;
  font-size: 30px;
}

.header p {
  color: #777;
  margin: 0;
}

.template-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 30px;
}

.template-btn {
  padding: 20px 10px;
  border: 2px solid #ddd;
  border-radius: 12px;
  background: white;
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
  transition: 0.2s;
}

.template-btn:hover {
  border-color: #ff7a00;
}

.template-btn.active {
  border-color: #ff7a00;
  background: #fff7ef;
  color: #e86800;
}

.form-card {
  background: white;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.section-title {
  font-size: 20px;
  font-weight: 700;
  margin: 35px 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #eee;
}

.section-title:first-child {
  margin-top: 0;
}

.field {
  margin-bottom: 22px;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 8px;
}

.optional {
  color: #999;
  font-size: 12px;
  font-weight: 400;
  margin-left: 5px;
}

.description {
  font-size: 13px;
  color: #888;
  margin-bottom: 8px;
}

input[type="text"],
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input[type="text"]:focus,
textarea:focus {
  border-color: #ff7a00;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

input[type="file"] {
  width: 100%;
  padding: 18px;
  background: #fafafa;
  border: 1px dashed #bbb;
  border-radius: 8px;
}

.submit-btn {
  width: 100%;
  margin-top: 30px;
  padding: 17px;
  border: none;
  border-radius: 10px;
  background: #ff7a00;
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

.submit-btn:hover {
  opacity: 0.9;
}

.empty-state {
  text-align: center;
  padding: 70px 20px;
  color: #888;
}

@media (max-width: 600px) {
  .template-selector {
    grid-template-columns: 1fr;
  }

  .container {
    margin-top: 30px;
  }

  .form-card {
    padding: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>우리주방그릇 콘텐츠 작성</h1>
    <p>작성할 콘텐츠를 선택하고 가지고 있는 정보만 입력해주세요.</p>
  </div>

  <div class="template-selector">

    <button
      type="button"
      class="template-btn"
      onclick="selectTemplate('대표약력', this)">
      🏆 대표약력
    </button>

    <button
      type="button"
      class="template-btn"
      onclick="selectTemplate('도면', this)">
      📐 도면
    </button>

    <button
      type="button"
      class="template-btn"
      onclick="selectTemplate('시공사례', this)">
      🔧 시공사례
    </button>

  </div>

  <div class="form-card">

    <form id="contentForm" enctype="multipart/form-data">

      <!-- n8n Switch가 사용할 핵심 값 -->
      <input
        type="hidden"
        id="templateType"
        name="templateType">

      <div id="dynamicForm">

        <div class="empty-state">
          위에서 작성할 콘텐츠를 선택해주세요.
        </div>

      </div>

    </form>

  </div>

</div>


<script>

/* =========================================
   1. 대표약력
========================================= */

const profileTemplate = `

<div class="section-title">수상 및 대표약력</div>

<div class="field">
  <label>
    상장 이름
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="상장 이름"
    placeholder="예: 부산광역시장 표창">
</div>


<div class="field">
  <label>
    수상과 관련된 이야기
    <span class="optional">선택</span>
  </label>

  <div class="description">
    수상 배경, 당시 있었던 일, 의미, 기억에 남는 이야기 등을 자유롭게 작성해주세요.
  </div>

  <textarea
    name="수상과 관련된 이야기"
    placeholder="알고 있는 내용만 편하게 작성해주세요."></textarea>
</div>


<div class="field">
  <label>
    상장 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="상장 사진"
    accept="image/*">
</div>


<button type="submit" class="submit-btn">
  대표약력 글 생성하기
</button>

`;



/* =========================================
   2. 도면
========================================= */

const drawingTemplate = `

<div class="section-title">도면 정보</div>


<div class="field">
  <label>
    지역 및 업장 이름
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="지역 및 업장 이름"
    placeholder="예: 부산 연제구 ○○돼지국밥">
</div>


<div class="field">
  <label>
    도면 특이사항
    <span class="optional">선택</span>
  </label>

  <div class="description">
    동선, 공간 구조, 장비 배치, 현장 제약 등 도면에서 강조할 내용을 입력해주세요.
  </div>

  <textarea
    name="도면 특이사항"
    placeholder="예: 좁은 공간에서 조리 동선을 최대한 짧게 설계"></textarea>
</div>


<div class="section-title">도면 사진</div>


<div class="field">
  <label>
    도면 사진 1
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="도면 사진 1"
    accept="image/*">
</div>


<div class="field">
  <label>
    도면 사진 2
    <span class="optional">선택</span>
  </label>

  <div class="description">
    추가 도면이 있는 경우에만 첨부해주세요.
  </div>

  <input
    type="file"
    name="도면 사진 2"
    accept="image/*">
</div>


<button type="submit" class="submit-btn">
  도면 글 생성하기
</button>

`;



/* =========================================
   3. 시공사례
========================================= */

const constructionTemplate = `

<div class="section-title">현장 기본 정보</div>


<div class="field">
  <label>
    업장 이름
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="업장 이름"
    placeholder="예: ○○돼지국밥">
</div>


<div class="field">
  <label>
    업종
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="업종"
    placeholder="예: 돼지국밥 전문점">
</div>


<div class="field">
  <label>
    현장 위치
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="현장 위치"
    placeholder="예: 부산 연제구">
</div>


<div class="field">
  <label>
    작업 유형
    <span class="optional">선택</span>
  </label>

  <input
    type="text"
    name="작업 유형"
    placeholder="예: 신규 주방 설계 및 시공">
</div>


<div class="section-title">현장 내용</div>


<div class="field">
  <label>
    기존 현장 문제점
    <span class="optional">선택</span>
  </label>

  <textarea
    name="기존 현장 문제점"
    placeholder="시공 전 현장의 문제점이나 불편했던 부분"></textarea>
</div>


<div class="field">
  <label>
    고객 요청사항
    <span class="optional">선택</span>
  </label>

  <textarea
    name="고객 요청사항"
    placeholder="고객이 특별히 요청했던 내용을 입력해주세요."></textarea>
</div>


<div class="field">
  <label>
    설치·납품한 제품
    <span class="optional">선택</span>
  </label>

  <textarea
    name="설치 납품한 제품"
    placeholder="예: 냉장고, 화구, 작업대, 싱크대 등"></textarea>
</div>


<div class="field">
  <label>
    이번 현장에서 강조할 내용
    <span class="optional">선택</span>
  </label>

  <textarea
    name="이번 현장 강조할 내용"
    placeholder="이번 작업에서 가장 보여주고 싶은 포인트"></textarea>
</div>


<div class="field">
  <label>
    작업 후 고객 만족
    <span class="optional">선택</span>
  </label>

  <textarea
    name="작업 후 고객 만족"
    placeholder="작업 후 고객 반응이나 만족했던 부분"></textarea>
</div>


<div class="field">
  <label>
    기타 특이사항
    <span class="optional">선택</span>
  </label>

  <textarea
    name="기타 특이사항"
    placeholder="글 작성에 참고할 추가 정보가 있다면 입력해주세요."></textarea>
</div>


<div class="section-title">현장 사진</div>


<div class="field">
  <label>
    블로그 썸네일 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="블로그 썸네일 사진"
    accept="image/*">
</div>


<div class="field">
  <label>
    매장 외관 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="매장 외관 사진"
    accept="image/*">
</div>


<div class="field">
  <label>
    시공 전 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="시공 전 사진"
    accept="image/*">
</div>


<div class="field">
  <label>
    시공 중 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="시공 중 사진"
    accept="image/*">
</div>


<div class="field">
  <label>
    도면
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="도면"
    accept="image/*">
</div>


<div class="field">
  <label>
    시공 후 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="시공 후 사진"
    accept="image/*">
</div>


<div class="field">
  <label>
    제품 설치 사진
    <span class="optional">선택</span>
  </label>

  <input
    type="file"
    name="제품 설치 사진"
    accept="image/*">
</div>


<button type="submit" class="submit-btn">
  시공사례 글 생성하기
</button>

`;



/* =========================================
   템플릿 선택
========================================= */

function selectTemplate(type, button) {

  document.getElementById("templateType").value = type;

  document
    .querySelectorAll(".template-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  let template = "";

  if (type === "대표약력") {
    template = profileTemplate;
  }

  if (type === "도면") {
    template = drawingTemplate;
  }

  if (type === "시공사례") {
    template = constructionTemplate;
  }

  document.getElementById("dynamicForm").innerHTML = template;
}



/* =========================================
   n8n 전송
========================================= */

document
  .getElementById("contentForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData(event.target);

    const templateType =
      formData.get("templateType");

    console.log(
      "선택된 콘텐츠:",
      templateType
    );

    
    ==========================================
    n8n 연결 시 활성화
    ==========================================

    const webhookUrl =
      "https://uri85222.app.n8n.cloud/webhook-test/wooriblog";

    try {

      const response = await fetch(
        webhookUrl,
        {
          method: "POST",
          body: formData
        }
      );

      if (!response.ok) {
        throw new Error("n8n 전송 실패");
      }

      alert("콘텐츠 생성 요청이 완료되었습니다.");

    } catch (error) {

      console.error(error);

      alert("전송 중 오류가 발생했습니다.");

    }

    

    alert(
      "테스트 모드\n\n" +
      "선택된 콘텐츠: " +
      templateType
    );

  });

</script>

</body>
</html>
