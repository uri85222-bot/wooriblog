<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>우리주방그릇 콘텐츠 작성</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 16px;
    }

    .template-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    .template-btn {
      padding: 22px 12px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .template-btn:hover {
      border-color: #ff7a00;
      transform: translateY(-1px);
    }

    .template-btn.active {
      border-color: #ff7a00;
      background: #fff7ef;
      color: #e86800;
    }

    .form-card {
      background: white;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    .empty-state {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      text-align: center;
      font-size: 16px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin: 34px 0 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .section-title:first-child {
      margin-top: 0;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .optional {
      font-size: 12px;
      color: #999;
      font-weight: 400;
      margin-left: 5px;
    }

    .description {
      color: #888;
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #ff7a00;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
      line-height: 1.6;
    }

    input[type="file"] {
      width: 100%;
      padding: 18px;
      border: 1px dashed #bbb;
      border-radius: 9px;
      background: #fafafa;
    }

    .submit-btn {
      width: 100%;
      padding: 17px;
      margin-top: 28px;
      border: none;
      border-radius: 11px;
      background: #ff7a00;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.92;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .container {
        margin: 25px auto;
        padding: 0 14px;
      }

      .header h1 {
        font-size: 25px;
      }

      .template-selector {
        grid-template-columns: 1fr;
      }

      .form-card {
        padding: 22px;
      }

      .template-btn {
        padding: 18px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>우리주방그릇 콘텐츠 작성</h1>
      <p>작성할 콘텐츠를 선택하고 가지고 있는 정보만 입력해주세요.</p>
    </div>

    <div class="template-selector">

      <button
        type="button"
        class="template-btn"
        data-template="대표약력">
        🏆 대표약력
      </button>

      <button
        type="button"
        class="template-btn"
        data-template="도면">
        📐 도면
      </button>

      <button
        type="button"
        class="template-btn"
        data-template="시공사례">
        🔧 시공사례
      </button>

    </div>

    <div class="form-card">

      <form id="contentForm" enctype="multipart/form-data">

        <input
          type="hidden"
          id="templateType"
          name="templateType"
        />

        <div id="dynamicForm">

          <div class="empty-state">
            위에서 작성할 콘텐츠를 선택해주세요.
          </div>

        </div>

        <div id="status" class="status"></div>

      </form>

    </div>

  </div>

  <script>
    const webhookUrl =
      "https://uri85222.app.n8n.cloud/webhook-test/wooriblog";


    const templates = {

      대표약력: `
        <div class="section-title">
          수상 및 대표약력
        </div>

        <div class="field">
          <label>
            상장 이름
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="상장 이름"
            placeholder="예: 부산광역시장 표창"
          />
        </div>

        <div class="field">
          <label>
            수상과 관련된 이야기
            <span class="optional">선택</span>
          </label>

          <div class="description">
            수상 배경, 당시 있었던 일, 의미 등을 자유롭게 작성해주세요.
          </div>

          <textarea
            name="수상과 관련된 이야기"
            placeholder="알고 있는 내용만 편하게 작성해주세요."
          ></textarea>
        </div>

        <div class="field">
          <label>
            상장 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="상장 사진"
            accept="image/*"
          />
        </div>

        <button
          type="submit"
          class="submit-btn">
          대표약력 글 생성하기
        </button>
      `,


      도면: `
        <div class="section-title">
          도면 정보
        </div>

        <div class="field">
          <label>
            지역 및 업장 이름
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="지역 및 업장 이름"
            placeholder="예: 부산 연제구 ○○돼지국밥"
          />
        </div>

        <div class="field">
          <label>
            도면 특이사항
            <span class="optional">선택</span>
          </label>

          <textarea
            name="도면 특이사항"
            placeholder="동선, 공간 구조, 장비 배치 등 특징을 입력해주세요."
          ></textarea>
        </div>

        <div class="field">
          <label>
            도면 사진 1
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="도면 사진 1"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            도면 사진 2
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="도면 사진 2"
            accept="image/*"
          />
        </div>

        <button
          type="submit"
          class="submit-btn">
          도면 글 생성하기
        </button>
      `,


      시공사례: `
        <div class="section-title">
          현장 기본 정보
        </div>

        <div class="field">
          <label>
            업장 이름
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="업장 이름"
          />
        </div>

        <div class="field">
          <label>
            업종
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="업종"
          />
        </div>

        <div class="field">
          <label>
            현장 위치
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="현장 위치"
          />
        </div>

        <div class="field">
          <label>
            작업 유형
            <span class="optional">선택</span>
          </label>

          <input
            type="text"
            name="작업 유형"
          />
        </div>

        <div class="section-title">
          현장 내용
        </div>

        <div class="field">
          <label>
            기존 현장 문제점
            <span class="optional">선택</span>
          </label>

          <textarea
            name="기존 현장 문제점"
          ></textarea>
        </div>

        <div class="field">
          <label>
            고객 요청사항
            <span class="optional">선택</span>
          </label>

          <textarea
            name="고객 요청사항"
          ></textarea>
        </div>

        <div class="field">
          <label>
            설치 납품한 제품
            <span class="optional">선택</span>
          </label>

          <textarea
            name="설치 납품한 제품"
          ></textarea>
        </div>

        <div class="field">
          <label>
            이번 현장 강조할 내용
            <span class="optional">선택</span>
          </label>

          <textarea
            name="이번 현장 강조할 내용"
          ></textarea>
        </div>

        <div class="field">
          <label>
            작업 후 고객 만족
            <span class="optional">선택</span>
          </label>

          <textarea
            name="작업 후 고객 만족"
          ></textarea>
        </div>

        <div class="field">
          <label>
            기타 특이사항
            <span class="optional">선택</span>
          </label>

          <textarea
            name="기타 특이사항"
          ></textarea>
        </div>


        <div class="section-title">
          현장 사진
        </div>

        <div class="field">
          <label>
            블로그 썸네일 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="블로그 썸네일 사진"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            매장 외관 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="매장 외관 사진"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            시공 전 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="시공 전 사진"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            시공 중 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="시공 중 사진"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            도면
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="도면"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            시공 후 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="시공 후 사진"
            accept="image/*"
          />
        </div>

        <div class="field">
          <label>
            제품 설치 사진
            <span class="optional">선택</span>
          </label>

          <input
            type="file"
            name="제품 설치 사진"
            accept="image/*"
          />
        </div>

        <button
          type="submit"
          class="submit-btn">
          시공사례 글 생성하기
        </button>
      `
    };


    const templateButtons =
      document.querySelectorAll(".template-btn");

    const templateTypeInput =
      document.getElementById("templateType");

    const dynamicForm =
      document.getElementById("dynamicForm");

    const form =
      document.getElementById("contentForm");

    const statusBox =
      document.getElementById("status");


    templateButtons.forEach(button => {

      button.addEventListener("click", function () {

        const type =
          this.dataset.template;

        templateTypeInput.value = type;

        templateButtons.forEach(btn => {
          btn.classList.remove("active");
        });

        this.classList.add("active");

        dynamicForm.innerHTML =
          templates[type];

        statusBox.textContent = "";
      });

    });


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        const selectedType =
          templateTypeInput.value;

        if (!selectedType) {
          alert("콘텐츠 종류를 먼저 선택해주세요.");
          return;
        }

        const submitButton =
          form.querySelector(".submit-btn");

        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent =
            "전송 중입니다...";
        }

        statusBox.textContent =
          "n8n으로 정보를 전송하고 있습니다.";

        try {

          const formData =
            new FormData(form);

          const response =
            await fetch(
              webhookUrl,
              {
                method: "POST",
                body: formData
              }
            );

          if (!response.ok) {
            throw new Error(
              "HTTP 오류: " +
              response.status
            );
          }

          statusBox.textContent =
            "콘텐츠 생성 요청이 완료되었습니다.";

          alert(
            "콘텐츠 생성 요청이 완료되었습니다."
          );

        } catch (error) {

          console.error(error);

          statusBox.textContent =
            "전송 중 오류가 발생했습니다.";

          alert(
            "n8n 전송에 실패했습니다.\n\n" +
            error.message
          );

        } finally {

          if (submitButton) {
            submitButton.disabled = false;

            if (selectedType === "대표약력") {
              submitButton.textContent =
                "대표약력 글 생성하기";
            }

            if (selectedType === "도면") {
              submitButton.textContent =
                "도면 글 생성하기";
            }

            if (selectedType === "시공사례") {
              submitButton.textContent =
                "시공사례 글 생성하기";
            }
          }

        }

      }
    );
  </script>

</body>
</html>
